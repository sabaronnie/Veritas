name: Twice Daily Task

on:
  schedule:
    - cron: "0 0,12 * * *"    # Runs at 00:00 UTC and 12:00 UTC
  workflow_dispatch:           # Optional manual trigger

jobs:
  run-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Add root to PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dailyScraper.txt

      - name: Run Daily Scrapers
        working-directory: backend/dailyScraper
        run: |
          echo "Running scrapers at $(date)"
          python3 lbcDaily.py
          python3 mtvDaily.py
          python3 961Daily.py
          python3 alManaraDaily.py